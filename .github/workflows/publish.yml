name: Publish

on:
  push:
    tags:
      - '@guiho/runx/v*'
      - 'runx/v*'

permissions:
  contents: write
  id-token: write

jobs:
  verify-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify real PowerShell clean install and reinstall
        run: go test -count=1 ./devops -run '^TestPowerShellInstallerCleanInstallAndReinstall$' -v

  publish:
    needs: verify-windows-installer
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve release metadata
        run: |
          VERSION="${GITHUB_REF_NAME#@guiho/runx/v}"
          VERSION="${VERSION#runx/v}"
          VERSION="${VERSION#v}"
          test -n "$VERSION"
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'BUILD_DATE=%s\n' "$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Build and verify canonical release matrix
        run: |
          go run devops/build-binaries.go --version "$VERSION" --commit "$GITHUB_SHA" --build-date "$BUILD_DATE"
          go run devops/verify-release-assets.go
          test "$(bundle/runx-payload-linux-amd64 --version)" = "$VERSION"
          bundle/runx-payload-linux-amd64 __self-test
      - name: Extract version-scoped release notes
        run: go run devops/extract-release-notes.go --version "$VERSION"
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --draft=false --latest
            gh release upload "$GITHUB_REF_NAME" bundle/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" bundle/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag --draft=false --latest
          fi
      - name: Verify exact GitHub release asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find bundle -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt
      - name: Verify exact-version installer
        run: |
          public_home="$(mktemp -d)"
          trap 'rm -rf "$public_home"' EXIT
          HOME="$public_home" RUNX_SKIP_PATH_UPDATE=1 \
            bash devops/install.sh --version "$VERSION"
          test "$(HOME="$public_home" RUNX_DISABLE_UPDATE_WORKER=1 RUNX_DISABLE_AGENT_MAINTENANCE_WORKER=1 "$public_home/.guiho/bin/runx" --version)" = "$VERSION"
          test "$(HOME="$public_home" "$public_home/.guiho/bin/runx" __self-test >/dev/null && echo ok)" = "ok"
