name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l main.go cmd pkg embed devops)"
      - name: Verify module graph
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Build native smoke binary
        shell: bash
        run: |
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed -E 's#^(@guiho/runx/v|@guiho/runx@|v)##' || true)"
          VERSION="${VERSION:-0.0.0-dev}"
          TARGET="runx-linux-amd64"
          OUTPUT="runx-smoke"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then TARGET="runx-windows-amd64"; OUTPUT="runx-smoke.exe"; fi
          go build -trimpath -ldflags "-X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.buildTarget=${TARGET}" -o "${OUTPUT}" .
          "./${OUTPUT}" --version
          "./${OUTPUT}" --help-tree-depth 2 --help-tree

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build canonical release matrix
        run: go run devops/build-binaries.go --version 0.0.0-dev --commit "$GITHUB_SHA" --build-date 2026-01-01T00:00:00Z
      - run: go run devops/verify-release-assets.go
      - name: Smoke native Linux artifact
        run: |
          test "$(bundle/runx-linux-amd64 --version)" = "0.0.0-dev"
          bundle/runx-linux-amd64 --help-tree-depth 2 --help-tree
      - name: Verify Node bootstrap syntax
        run: node --check scripts/runx-bin.mjs
